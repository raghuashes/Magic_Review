server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: magic-review
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:magicreview}
    username: ${DB_USERNAME:magicreview}
    password: ${DB_PASSWORD:magicreview}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_new_id_insert_mappings: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Gemini AI
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:ChangeMeSuperSecretKeyThatIsAtLeast32CharsLong!!!}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8080}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.magicreview: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      profile: docker
server:
  port: 8080

---
spring:
  config:
    activate:
      profile: prod
server:
  port: ${PORT:8080}
logging:
  level:
    com.magicreview: INFO
    org.springframework.security: WARN